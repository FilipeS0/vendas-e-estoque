spring:
  application:
    name: api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

api:
  security:
    token:
      secret: ${JWT_SECRET:your-local-dev-secret-key-1234567890}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  crypto:
    secret: ${CRYPTO_SECRET:0123456789abcdef0123456789abcdef}

app:
  upload:
    dir: uploads
