<h2 mat-dialog-title>Novo cliente</h2>
<mat-dialog-content class="dialog-content">
  <form [formGroup]="form" class="dialog-form">
    <app-form-input
      label="Nome"
      formControlName="nome"
      autocomplete="name"
      error="O nome é obrigatório."
    />

    <app-form-input
      label="CPF"
      formControlName="cpf"
      maxlength="14"
      autocomplete="off"
      placeholder="000.000.000-00"
      (fieldInput)="formatCpf($event)"
    />

    <app-form-input label="Telefone" formControlName="telefone" autocomplete="tel" />

    <div class="form-row-cep">
      <app-form-input
        label="CEP"
        formControlName="cep"
        maxlength="9"
        placeholder="00000-000"
        (fieldBlur)="consultarCep()"
      >
        @if (isLoadingCep()) {
          <mat-spinner matSuffix [diameter]="18"></mat-spinner>
        } @else {
          <button mat-icon-button matSuffix (click)="consultarCep()" type="button" [disabled]="form.get('cep')?.invalid">
            <mat-icon>search</mat-icon>
          </button>
        }
      </app-form-input>
    </div>

    <app-form-input label="Logradouro" formControlName="logradouro" />

    <div class="form-row">
      <app-form-input label="Número" formControlName="numero" />
      <app-form-input label="Bairro" formControlName="bairro" />
    </div>

    <div class="form-row">
      <app-form-input label="Cidade" formControlName="cidade" />
      <app-form-input label="UF" formControlName="uf" maxlength="2" class="uf-field" />
    </div>

    <app-form-input
      label="Limite de crédito"
      type="number"
      formControlName="limiteCredito"
      min="0"
      error="O limite deve ser maior ou igual a 0."
    />
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="form.invalid || isSaving">
    Criar cliente
  </button>
</mat-dialog-actions>
