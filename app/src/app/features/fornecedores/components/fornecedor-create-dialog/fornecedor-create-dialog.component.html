<h2 mat-dialog-title>Novo fornecedor</h2>
<mat-dialog-content class="dialog-content">
  <form [formGroup]="form" class="dialog-form">
    <div class="form-row-cnpj">
      <app-form-input
        label="CNPJ"
        formControlName="cnpj"
        maxlength="18"
        placeholder="00.000.000/0000-00"
        (fieldInput)="formatCnpj($event)"
        (fieldBlur)="consultarCnpj()"
      >
        @if (isLoadingCnpj()) {
          <mat-spinner matSuffix [diameter]="18"></mat-spinner>
        } @else {
          <button mat-icon-button matSuffix (click)="consultarCnpj()" type="button" [disabled]="form.get('cnpj')?.invalid">
            <mat-icon>search</mat-icon>
          </button>
        }
      </app-form-input>
    </div>

    <app-form-input
      label="Nome / Razão Social"
      formControlName="nome"
      error="O nome é obrigatório."
    />

    <div class="form-row">
      <app-form-input label="Email" type="email" formControlName="email" />
      <app-form-input label="Telefone" formControlName="telefone" />
    </div>

    <div class="form-row-cep">
      <app-form-input
        label="CEP"
        formControlName="cep"
        maxlength="9"
        placeholder="00000-000"
        (fieldBlur)="consultarCep()"
      >
        @if (isLoadingCep()) {
          <mat-spinner matSuffix [diameter]="18"></mat-spinner>
        } @else {
          <button mat-icon-button matSuffix (click)="consultarCep()" type="button" [disabled]="form.get('cep')?.invalid">
            <mat-icon>search</mat-icon>
          </button>
        }
      </app-form-input>
    </div>

    <app-form-input label="Logradouro" formControlName="logradouro" />

    <div class="form-row">
      <app-form-input label="Número" formControlName="numero" />
      <app-form-input label="Bairro" formControlName="bairro" />
    </div>

    <div class="form-row">
      <app-form-input label="Cidade" formControlName="cidade" />
      <app-form-input label="UF" formControlName="uf" maxlength="2" class="uf-field" />
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="form.invalid || isSaving">
    Criar fornecedor
  </button>
</mat-dialog-actions>
