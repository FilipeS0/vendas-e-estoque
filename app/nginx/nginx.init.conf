# ─── Config TEMPORÁRIA — usar apenas na primeira emissão do certificado ───────
#
# O Certbot precisa responder ao ACME challenge via HTTP antes de o certificado
# existir. Use este arquivo no primeiro deploy:
#
#   1. Copie este arquivo como default.conf no container:
#      docker compose -f docker-compose.prod.yml run --rm \
#        -v ./nginx/nginx.init.conf:/etc/nginx/conf.d/default.conf:ro frontend
#
#   2. Emita o certificado:
#      docker compose -f docker-compose.prod.yml run --rm certbot \
#        certbot certonly --webroot --webroot-path=/var/www/certbot \
#        --email SEU@EMAIL.COM --agree-tos --no-eff-email \
#        -d SEU_DOMINIO.COM
#
#   3. Substitua pelo nginx.prod.conf e suba normalmente:
#      docker compose -f docker-compose.prod.yml up -d
#
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'aguardando certificado SSL...';
        add_header Content-Type text/plain;
    }
}